# >>> abot 🟨 prompt marker >>>
# Prepend a 🟨 marker to the line you type in a Codex / Claude prompt when you
# press Enter, so your own input is easy to spot in the shared terminal view
# (useful when watching a session through abot on your phone).
#
# Only fires in a *normal* Codex/Claude input prompt. Approval dialogs, slash
# menus, copy-mode, and every other program keep Enter's original behavior.
# F6 is a manual fallback that always inserts the marker in Codex/Claude.
#
# __TMUX_BIN__ is your tmux binary path — tmux/install-marker.sh substitutes it
# automatically (macOS Homebrew: /opt/homebrew/bin/tmux, Linux/WSL: /usr/bin/tmux).
# pgrep/sed/tail/awk/test live at the same paths on macOS and Linux.

bind-key -n F6 if-shell \
    "/bin/test '#{pane_current_command}' = codex || /usr/bin/pgrep -P '#{pane_pid}' -f '(^|/)codex( |$)' >/dev/null || /bin/test '#{pane_current_command}' = claude || /usr/bin/pgrep -P '#{pane_pid}' -f '(^|/)claude( |$)' >/dev/null" \
    "send-keys C-a ; send-keys -l '🟨 ' ; send-keys C-e ; send-keys Enter" \
    "send-keys F6"

# Physical Enter only; send-keys Enter is delivered to the pane and does not recurse.
bind-key -n Enter if-shell \
    "( /bin/test '#{pane_current_command}' = codex || /usr/bin/pgrep -P '#{pane_pid}' -f '(^|/)codex( |$)' >/dev/null || /bin/test '#{pane_current_command}' = claude || /usr/bin/pgrep -P '#{pane_pid}' -f '(^|/)claude( |$)' >/dev/null ) && __TMUX_BIN__ -S '#{socket_path}' capture-pane -p -t '#{pane_id}' | /usr/bin/sed '/^[[:space:]]*$/d' | /usr/bin/tail -n 8 | /usr/bin/awk '/^[[:space:]]+[^[:space:]]+[[:space:]]+(low|medium|high|xhigh)[[:space:]]+·[[:space:]]/ { ok=1 } /^› / && $0 !~ /^› \\// && $0 !~ /^› [0-9]+[.)]/ { ok=1 } /^❯/ { claude_prompt=1 } /^❯[[:space:]]*\\// { claude_slash=1 } END { if (claude_prompt && !claude_slash) ok=1; exit !ok }'" \
    "send-keys C-a ; send-keys -l '🟨 ' ; send-keys C-e ; send-keys Enter" \
    "send-keys Enter"
# <<< abot 🟨 prompt marker <<<
